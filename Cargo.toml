[package]
name = "limits"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# Enable with `cargo run --features dev` for fast iteration via dynamic linking.
# Release builds intentionally do NOT enable this so binaries stay statically linked.
dev = ["bevy/dynamic_linking"]

[dependencies]
# `tonemapping_luts`: TonyMcMapface for the HDR/bloom space look.
# bevy_audio's plugin is disabled in main.rs — audio goes through our own
# rodio stream (audio.rs) so a vanished output device can be recovered.
bevy = { version = "0.18.1", features = ["tonemapping_luts"] }
# Same rodio bevy_audio resolves to (keep these in lockstep). No decoder
# features: every clip is synthesized as raw samples.
rodio = { version = "0.20.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rodio = { version = "0.20.1", default-features = false, features = ["wasm-bindgen"] }

# Optimize our own crate lightly so debug-build runtime is bearable at 100k+ entities,
# and optimize all dependencies (including Bevy) fully — this is the standard Bevy
# "fast compile, fast run" dev profile.
[profile.dev]
opt-level = 1
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 3

# Release uses defaults: opt-level=3, codegen-units=16, no LTO. Add LTO later only if
# profiling shows it helps — it triples link time.
